<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lecteur Vidéo - BU</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* Image de fond */
    .background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -1;
    }

    /* Contenu centré */
    .content {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
      padding: 20px;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
    }

    p {
      margin-bottom: 20px;
    }

    button {
      padding: 15px 30px;
      font-size: 1.2em;
      margin-top: 20px;
      border: none;
      border-radius: 8px;
      background-color: #00c9ff;
      color: #fff;
      cursor: pointer;
    }

    button:hover {
      background-color: #007ea7;
    }

    video {
      display: none; /* on ne montre pas le lecteur */
    }
  </style>
</head>
<body>
  <!-- Image de fond -->
  <img class="background" src="Dossier_Objets_et_dispositifs_interactifs_20250501_173147_0000.PNG" alt="Fond" />

  <div class="content">
    <h1>BU</h1>
    <p>Appuyez sur le bouton pour lancer le son.</p>

    <!-- Vidéo contenant le son -->
    <video id="player"loop controls>
      <source src="sons/BU.mp4" type="video/mp4">
      Ton navigateur ne supporte pas la vidéo HTML5.
    </video>

    <button onclick="document.getElementById('player').play()">Lancer le son</button>
  </div>
</body>
</html>
