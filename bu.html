<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lecteur Vidéo - BU</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-image: url('Dossier_Objets_et_dispositifs_interactifs_20250501_173147_0000.PNG');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      background-attachment: fixed;
      color: white;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
    }

    p {
      margin-bottom: 20px;
    }

    button {
      padding: 15px 30px;
      font-size: 1.2em;
      margin-top: 20px;
      border: none;
      border-radius: 8px;
      background-color: #00c9ff;
      color: #fff;
      cursor: pointer;
    }

    button:hover {
      background-color: #007ea7;
    }

    video {
      margin-top: 30px;
      max-width: 90%;
      height: auto;
      border: 2px solid #fff;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <h1>BU</h1>
  <p>Appuyez sur le bouton pour lancer le son.</p>

  <video id="player" loop controls>
    <source src="sons/BU.mp4" type="video/mp4">
    Ton navigateur ne supporte pas la vidéo HTML5.
  </video>

  <br />
  <button onclick="document.getElementById('player').play()">Lancer le son</button>
</body>
</html>
